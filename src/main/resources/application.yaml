spring:
  application:
    name: tdb-vazhipadu-backend
  datasource:
    url: jdbc:h2:mem:${DB_NAME:vazhipadu}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
app:
  auth:
    admin-email: ${ADMIN_EMAIL}
    admin-password: ${ADMIN_PASSWORD}
    signing-key: ${JWT_SIGNING_KEY}
    token-ttl: ${JWT_TTL:PT1H}
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
